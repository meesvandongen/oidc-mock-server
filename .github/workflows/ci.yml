name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node.
      - run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # The server runs on Bun, so check that it still bundles for Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun build src/run.ts --target=bun --outdir=dist
